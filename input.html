<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimpse</title>
<script>
  // QR은 이 주소(input.html#방)를 가리킨다. 폰에서는 작업 설명 화면이 기본이고,
  // 입력창은 그 위에 팝업으로 뜬다. 이미 찍힌 QR도 그대로 쓰이도록 여기서 넘겨준다
  location.replace('index.html?read' + location.hash);
</script>
</head>
<body></body>
</html>
